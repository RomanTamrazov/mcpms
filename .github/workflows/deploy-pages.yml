name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p pages
          cp -R dist/client/. pages/
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -d "pages/$REPO_NAME" ]; then
            cp -R "pages/$REPO_NAME/." pages/
            rm -rf "pages/$REPO_NAME"
          fi
          # Keep direct links and refresh working for the client-side routes.
          find pages -type f -name '*.html' ! -name 'index.html' -print0 | while IFS= read -r -d '' page; do
            target="${page%.html}/index.html"
            mkdir -p "$(dirname "$target")"
            cp "$page" "$target"
          done
          cp pages/index.html pages/404.html
          touch pages/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
